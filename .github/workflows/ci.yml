name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-core:
    name: Backend Core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore SchoolManagement.sln

      - name: Build
        run: dotnet build SchoolManagement.sln --configuration Release --no-restore

      - name: Test core backend suite
        run: dotnet test tests/SchoolManagement.Tests/SchoolManagement.Tests.csproj --configuration Release --no-build --filter "Category!=PostgreSQL" --verbosity normal

  backend-postgresql:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore SchoolManagement.sln

      - name: Build
        run: dotnet build SchoolManagement.sln --configuration Release --no-restore

      - name: Test PostgreSQL integration suite
        run: dotnet test tests/SchoolManagement.Tests/SchoolManagement.Tests.csproj --configuration Release --no-build --filter "Category=PostgreSQL" --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
